<!doctype html>
<html lang="vi" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Be Vietnam Pro";
        src: url("assets/fonts/BeVietnamPro-400.ttf") format("truetype");
        font-weight: 400;
      }
      @font-face {
        font-family: "Be Vietnam Pro";
        src: url("assets/fonts/BeVietnamPro-700.ttf") format("truetype");
        font-weight: 700;
      }
      :root {
        --ground: #ffe9a8;
        --ink: #1d1f27;
        --accent: #ff6b6b;
        --strip-top: #2b2e39;
        --strip-bottom: #15171e;
        --lid: #22252f;
        --font-display: "Be Vietnam Pro", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--ground);
        font-family: var(--font-display);
      }
      .layer {
        position: absolute;
        inset: 0;
      }

      /* ---------- world A: the home stage ---------- */
      #ground {
        background: var(--ground);
      }
      #stage {
        position: absolute;
        inset: 0;
      }
      #stage-art {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #ground-grain {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0.5;
        mix-blend-mode: multiply;
      }
      #ground-vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 45%, rgba(255, 255, 255, 0) 55%, rgba(150, 90, 0, 0.12) 100%);
      }

      /* ---------- camera ---------- */
      #cam {
        position: absolute;
        inset: 0;
        transform-origin: 0 0;
      }

      /* ---------- world B: the desktop ---------- */
      #desk-art {
        position: absolute;
        inset: 0;
      }
      #desk-art svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* ---------- the taskbar character ---------- */
      #hero {
        position: absolute;
        left: 0;
        top: 0;
        width: 720px;
        height: 72px;
        transform-origin: 50% 50%;
        z-index: 5;
      }
      #shadow {
        position: absolute;
        left: 4%;
        width: 92%;
        top: 70px;
        height: 18px;
        background: radial-gradient(ellipse at 50% 30%, rgba(90, 55, 0, 0.32) 0%, rgba(90, 55, 0, 0) 70%);
        filter: blur(3px);
      }
      #bob,
      #squash,
      #breath {
        position: absolute;
        inset: 0;
        transform-origin: 50% 100%;
      }
      #strip {
        position: absolute;
        inset: 0;
        border-radius: 36px;
      }
      #glass {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(180deg, var(--strip-top) 0%, var(--strip-bottom) 100%);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.18),
          inset 0 -1px 0 rgba(0, 0, 0, 0.4);
      }
      #seeks {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        overflow: hidden;
      }
      #seeks video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #seeks video.fill {
        object-fit: fill;
      }
      #face {
        position: absolute;
        left: 0;
        top: 0;
        width: 100px;
        height: 72px;
      }
      .eye {
        position: absolute;
        top: 17px;
        width: 18px;
        height: 24px;
      }
      #eyeL {
        left: 27px;
      }
      #eyeR {
        left: 53px;
      }
      .eye-ball {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        overflow: hidden;
        background: #fffdf6;
        box-shadow: 0 0 0 2px #15171e;
      }
      .pupil {
        position: absolute;
        left: 5px;
        top: 8px;
        width: 8px;
        height: 10px;
        border-radius: 50%;
        background: #15171e;
      }
      .shine {
        position: absolute;
        left: 2px;
        top: 1px;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: #fff;
      }
      .lid {
        position: absolute;
        left: -2px;
        top: -2px;
        width: 22px;
        height: 28px;
        background: var(--lid);
        border-bottom: 2px solid #0e1015;
        transform-origin: 50% 0;
      }
      .eye-happy {
        position: absolute;
        inset: 0;
        opacity: 0;
      }
      .eye-happy path {
        fill: none;
        stroke: #fffdf6;
        stroke-width: 3.5;
        stroke-linecap: round;
      }
      #mouth {
        position: absolute;
        left: 29px;
        top: 45px;
        width: 40px;
        height: 18px;
        overflow: visible;
      }
      #mouth .m {
        opacity: 0;
      }
      #mouth .line {
        fill: none;
        stroke: #fffdf6;
        stroke-width: 3;
        stroke-linecap: round;
      }
      #mouth .hole {
        fill: #120c10;
        stroke: #fffdf6;
        stroke-width: 2.4;
        stroke-linejoin: round;
      }
      #mouth .tongue {
        fill: #ff7b8a;
      }
      #apps {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .app {
        width: 50px;
        height: 50px;
        border-radius: 9px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .app svg {
        width: 30px;
        height: 30px;
      }
      #tray {
        position: absolute;
        right: 16px;
        top: 0;
        height: 72px;
        display: flex;
        align-items: center;
      }
      .tray-i {
        position: relative;
        width: 26px;
        height: 40px;
        margin-right: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .tray-i svg {
        position: relative;
        width: 22px;
        height: 22px;
      }
      .tray-i.chev {
        width: 20px;
      }
      #spk-hl {
        position: absolute;
        left: -7px;
        right: -7px;
        top: 2px;
        bottom: 2px;
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.16);
        opacity: 0;
      }
      #clock {
        width: 84px;
        text-align: right;
        color: #fff;
        line-height: 1.15;
      }
      #clock-time {
        position: relative;
        height: 23px;
        overflow: hidden;
        font-size: 19px;
        font-weight: 400;
      }
      #clock-time span {
        position: absolute;
        right: 0;
        top: 0;
      }
      #clock-date {
        font-size: 12px;
        font-weight: 400;
        color: rgba(255, 255, 255, 0.78);
      }
      #cobweb {
        position: absolute;
        right: 6px;
        top: -2px;
        width: 74px;
        height: 46px;
        overflow: visible;
      }
      #cobweb path {
        fill: none;
        stroke: rgba(255, 255, 255, 0.62);
        stroke-width: 1.3;
        stroke-linecap: round;
      }
      #lyrics {
        position: absolute;
        left: 150px;
        top: -12px;
        width: 537.6px;
        height: 96px;
      }
      #lyrics video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #mic {
        position: absolute;
        left: 98px;
        top: -24px;
        width: 26px;
        height: 70px;
        overflow: visible;
      }
      #sweat {
        position: absolute;
        left: 84px;
        top: 4px;
        width: 10px;
        height: 15px;
        overflow: visible;
      }

      /* ---------- props ---------- */
      #icon {
        position: absolute;
        left: 0;
        top: 0;
        width: 200px;
        height: 200px;
        z-index: 6;
        transform-origin: 50% 50%;
      }
      #icon img {
        display: block;
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 14px 18px rgba(90, 55, 0, 0.28));
      }
      .note {
        position: absolute;
        left: 0;
        top: 0;
        width: 46px;
        height: 56px;
        overflow: visible;
      }
      #notes,
      #notes2 {
        z-index: 6;
      }
      #panel {
        z-index: 7;
      }
      #panel-pop {
        position: absolute;
        inset: 0;
      }
      #panel img {
        position: absolute;
        display: block;
      }
      #pnl-list {
        left: 884px;
        top: 579.8px;
        width: 462.2px;
        height: 414.7px;
      }
      #pnl-open,
      #pnl-out {
        left: 884px;
        top: 119px;
        width: 1022.4px;
        height: 875.5px;
      }
      #pnl-out {
        clip-path: inset(0 0 0 45%);
      }
      #squeegee,
      #glint,
      #sparkles {
        z-index: 8;
      }
      #squeegee-art {
        position: absolute;
        left: 0;
        top: 0;
        width: 120px;
        height: 200px;
        overflow: visible;
      }
      #glint-band {
        position: absolute;
        left: 0;
        top: 1008px;
        width: 260px;
        height: 72px;
        background: linear-gradient(100deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.55) 45%, rgba(255, 255, 255, 0.8) 50%, rgba(255, 255, 255, 0.55) 55%, rgba(255, 255, 255, 0) 100%);
      }
      .spark {
        position: absolute;
        width: 46px;
        height: 46px;
        overflow: visible;
        transform-origin: 50% 50%;
      }
      #cursor {
        z-index: 9;
      }
      #cursor-art {
        position: absolute;
        left: 0;
        top: 0;
        width: 48px;
        height: 66px;
        overflow: visible;
        transform-origin: 0 0;
      }

      /* ---------- type ---------- */
      #tags {
        z-index: 10;
      }
      .tag {
        position: absolute;
        left: 0;
        right: 0;
        top: 170px;
        height: 150px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .tag-text {
        display: block;
        color: var(--ink);
        font-weight: 700;
        font-size: 104px;
        line-height: 1;
        letter-spacing: -0.02em;
        white-space: nowrap;
      }
      #tag-14 .tag-text {
        display: flex;
        align-items: baseline;
        gap: 22px;
      }
      #tag-14 .num {
        color: var(--accent);
        font-size: 190px;
        letter-spacing: -0.04em;
      }
      #tag-14 .sub {
        font-size: 56px;
        letter-spacing: -0.01em;
      }
      #endcard {
        z-index: 10;
      }
      #wordmark {
        position: absolute;
        left: 790px;
        top: 268px;
        height: 170px;
        display: flex;
        align-items: center;
        color: var(--ink);
        font-weight: 700;
        font-size: 136px;
        letter-spacing: -0.03em;
        line-height: 1;
        white-space: nowrap;
      }
      #tagline {
        position: absolute;
        left: 0;
        right: 0;
        top: 462px;
        text-align: center;
        color: var(--ink);
        font-weight: 700;
        font-size: 66px;
        letter-spacing: -0.015em;
        line-height: 1.1;
      }
      #tagline span {
        display: inline-block;
        margin: 0 0.12em;
      }
      #tagline .hl {
        color: #e8474b;
      }
    </style>
  </head>

    <script>
      (function () {
        // ---------- the stage set, drawn once (deterministic geometry) ----------
        const SVG = "http://www.w3.org/2000/svg";
        const planks = document.getElementById("st-planks");
        const line = (x1, y1, x2, y2) => {
          const l = document.createElementNS(SVG, "line");
          [["x1", x1], ["y1", y1], ["x2", x2], ["y2", y2]].forEach(([k, v]) => l.setAttribute(k, v));
          planks.appendChild(l);
        };
        // Boards run toward a vanishing point high above the stage; seams get closer near the back.
        for (let i = -14; i <= 14; i++) {
          const xb = 960 + i * 150;
          line(960 + (xb - 960) * 0.72, 548, xb, 1080);
        }
        [592, 650, 728, 832, 972].forEach((y) => line(0, y, 1920, y));
        let d = "M0 0 H1920 V96";
        for (let k = 11; k >= 0; k--) d += ` Q ${k * 160 + 80} 156 ${k * 160} 96`;
        document.getElementById("st-valance").setAttribute("d", d + " Z");
        const bulbs = document.getElementById("st-bulbs");
        for (let k = 0; k < 24; k++) {
          const c = document.createElementNS(SVG, "circle");
          const x = 40 + k * 80;
          const phase = ((x % 160) + 160) % 160;
          c.setAttribute("cx", x);
          c.setAttribute("cy", 96 + 60 * (1 - Math.pow((phase - 80) / 80, 2)) * 0.82);
          c.setAttribute("r", 10);
          c.setAttribute("class", "bulb " + (k % 2 ? "odd" : "even"));
          c.setAttribute("stroke", "#B9822A");
          c.setAttribute("stroke-width", 2.5);
          bulbs.appendChild(c);
        }

        const tl = gsap.timeline({ paused: true });
        const set = (t, sel, vars) => tl.set(sel, vars, t);
        const to = (t, sel, vars) => tl.to(sel, vars, t);
        const beat = (k) => 14 + (k * 60) / 140;

        // Hero placements: the macro stage strip, and the full-width desktop taskbar.
        const MACRO = { x: 600, y: 414, scale: 2.0833, width: 720 };
        const DESK = { x: 0, y: 1008, scale: 1, width: 1920 };
        const END = { x: 600, y: 764, scale: 1.6, width: 720 };

        // ---------- the rig ----------
        const LID = { open: 0.04, wide: 0, sleepy: 0.56, tired: 0.42, closed: 1 };
        function eyes(t, state, dur = 0.12) {
          const happy = state === "happy";
          set(t, ".eye-ball", { opacity: happy ? 0 : 1 });
          set(t, ".eye-happy", { opacity: happy ? 1 : 0 });
          if (!happy) {
            to(t, "#eyeL .lid", { scaleY: LID[state], duration: dur, ease: "power2.out" });
            to(t + 0.067, "#eyeR .lid", { scaleY: LID[state], duration: dur, ease: "power2.out" });
          }
        }
        function look(t, x, y, dur = 0.18) {
          to(t, "#eyeL .pupil", { x, y, duration: dur, ease: "power2.out" });
          to(t + 0.05, "#eyeR .pupil", { x, y, duration: dur, ease: "power2.out" });
        }
        function blink(t, back) {
          to(t, ".lid", { scaleY: 1, duration: 0.05, ease: "power1.in" });
          to(t + 0.09, ".lid", { scaleY: LID[back], duration: 0.1, ease: "power1.out" });
        }
        const MOUTHS = ["#m-flat", "#m-smile", "#m-frown", "#m-yawn", "#m-o", "#m-open"];
        function mouth(t, name) {
          MOUTHS.forEach((m) => set(t, m, { opacity: m === "#m-" + name ? 1 : 0 }));
        }
        // A take: squash down, then spring back.
        function squash(t, sy = 0.86, sx = 1.06) {
          to(t, "#squash", { scaleY: sy, scaleX: sx, duration: 0.07, ease: "power2.out" });
          to(t + 0.07, "#squash", { scaleY: 1, scaleX: 1, duration: 0.38, ease: "back.out(2.6)" });
        }
        // A hop on the beat: up, down, a landing squash.
        function hop(t, height, tilt = 0) {
          to(t - 0.2, "#bob", { y: -height, rotation: tilt, duration: 0.2, ease: "power2.out" });
          to(t, "#bob", { y: 0, duration: 0.17, ease: "power2.in" });
          to(t + 0.17, "#squash", { scaleY: 0.9, scaleX: 1.04, duration: 0.05, ease: "power1.out" });
          to(t + 0.22, "#squash", { scaleY: 1, scaleX: 1, duration: 0.2, ease: "back.out(2)" });
        }
        function place(t, p, dur, ease) {
          to(t, "#hero", { x: p.x, y: p.y, scale: p.scale, width: p.width, duration: dur, ease });
        }

        // ---------- initial state ----------
        set(0, "#hero", { x: MACRO.x, y: MACRO.y, scale: MACRO.scale, width: MACRO.width });
        set(0, "#bob", { y: 0, rotation: 0 });
        set(0, "#squash", { scaleX: 1, scaleY: 1 });
        set(0, "#breath", { scaleY: 1 });
        set(0, "#strip", { borderRadius: 36 });
        set(0, "#glass", { clipPath: "inset(0% 0% 0% 0%)" });
        set(0, "#seeks", { clipPath: "inset(0% 100% 0% 0%)" });
        set(0, "#cam", { x: 0, y: 0, scale: 1 });
        // The stage starts with its lights off.
        const LIT = "#FFF4C9", DIM = "#8E6446";
        set(0, "#stage", { scale: 1, transformOrigin: "82.8% 40.5%" });
        set(0, "#stage-dim", { opacity: 0.52 });
        set(0, "#spot", { opacity: 0 });
        set(0, ".bulb", { fill: DIM });
        set(0, "#drape-l", { x: 0 });
        set(0, "#drape-r", { x: 0 });
        // A marquee chase: odd and even bulbs swap on each beat, then all stay lit.
        function chase(k0, k1) {
          for (let k = k0; k <= k1; k++) {
            set(beat(k), ".bulb.odd", { fill: k % 2 ? LIT : DIM });
            set(beat(k), ".bulb.even", { fill: k % 2 ? DIM : LIT });
          }
          set(beat(k1 + 1), ".bulb", { fill: LIT });
        }
        set(0, "#shadow", { opacity: 1 });
        set(0, "#clk-a", { yPercent: 0 });
        set(0, "#clk-b", { yPercent: 110 });
        set(0, "#cobweb", { opacity: 0, x: 0, y: 0, rotation: 0 });
        set(0, "#cobweb .web", { strokeDasharray: 120, strokeDashoffset: 120 });
        set(0, "#mic", { opacity: 0, scale: 0, y: 0, transformOrigin: "50% 100%" });
        set(0, "#sweat", { opacity: 0, y: 0 });
        set(0, "#apps", { opacity: 1, y: 0 });
        set(0, "#tray", { opacity: 1, y: 0 });
        set(0, "#icon", { x: 1080, y: -260, scale: 0.75, opacity: 0, rotation: 0 });
        set(0, ".lid", { scaleY: LID.sleepy });
        set(0, ".pupil", { x: 0, y: 1 });
        eyes(0, "sleepy", 0.01);
        mouth(0, "flat");

        // Idle breath while it sleeps (acting, not decoration).
        to(0, "#breath", { scaleY: 1.016, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 9 });

        // ---------- S1 hook: thirty years of lying still ----------
        blink(1.55, "sleepy");
        // "Ba mươi năm nay": dust gathers.
        set(3.0, "#cobweb", { opacity: 1 });
        to(3.0, "#cobweb .web", { strokeDashoffset: 0, duration: 0.6, ease: "power2.out", stagger: 0.05 });
        // "nằm im": eyes shut, it flattens.
        eyes(5.85, "closed", 0.2);
        to(5.85, "#squash", { scaleY: 0.94, scaleX: 1.01, duration: 0.4, ease: "power2.out" });
        // Yawn.
        mouth(6.38, "yawn");
        to(6.38, "#squash", { scaleY: 1.13, scaleX: 0.97, duration: 0.45, ease: "power2.out" });
        to(7.0, "#squash", { scaleY: 1, scaleX: 1, duration: 0.4, ease: "back.out(2)" });
        mouth(7.15, "flat");
        eyes(7.2, "sleepy", 0.2);
        // "Nhạc phát cả ngày": notes drift past; it doesn't care.
        [["#note1", 7.3, 230, -10], ["#note2", 7.6, 140, 12], ["#note3", 7.95, 260, -6]].forEach(([n, t, y, r]) => {
          set(7.25, n, { x: -120, y, rotation: r, opacity: 1, scale: 1.8 });
          to(t, n, { x: 2040, duration: 2.3, ease: "none" });
          to(t, n, { y: y - 40, duration: 0.38, ease: "sine.inOut", yoyo: true, repeat: 5 });
        });
        look(7.6, 3, 0);
        eyes(8.0, "closed", 0.15);
        eyes(8.9, "sleepy", 0.15);
        look(8.9, 4, 1);
        // "hiện mỗi cái đồng hồ": punch into the clock, the minute flips.
        to(9.85, "#cam", { x: -2536, y: -492, scale: 2.2, duration: 0.55, ease: "power2.inOut" });
        to(9.85, "#stage", { scale: 1.35, duration: 0.55, ease: "power2.inOut" });
        to(11.2, "#stage", { scale: 1, duration: 0.5, ease: "power2.inOut" });
        to(10.75, "#clk-a", { yPercent: -110, duration: 0.18, ease: "power2.in" });
        to(10.75, "#clk-b", { yPercent: 0, duration: 0.22, ease: "power3.out" });
        to(11.2, "#cam", { x: 0, y: 0, scale: 1, duration: 0.5, ease: "power2.inOut" });
        // Sad trombone: it sags.
        mouth(11.3, "frown");
        look(11.3, 0, 4, 0.3);
        to(11.3, "#squash", { scaleY: 0.9, scaleX: 1.02, duration: 0.9, ease: "power1.out" });

        // ---------- S2 the scratch, the reveal ----------
        // Record scratch: it jolts awake.
        eyes(12.33, "wide", 0.06);
        set(12.33, ".pupil", { x: 0, y: 0, scale: 0.8 });
        mouth(12.33, "o");
        to(12.33, "#squash", { scaleY: 1.12, scaleX: 0.96, duration: 0.07, ease: "power2.out" });
        to(12.4, "#squash", { scaleY: 1, scaleX: 1, duration: 0.4, ease: "back.out(3)" });
        to(12.33, "#bob", { y: -10, duration: 0.08, ease: "power2.out" });
        to(12.41, "#bob", { y: 0, duration: 0.3, ease: "bounce.out" });
        to(12.36, "#cobweb", { y: -70, x: 40, rotation: 35, opacity: 0, duration: 0.45, ease: "power2.in" });
        // "Cho đến hôm nay!": it looks up, where the icon comes from.
        look(12.9, 2, -4, 0.2);
        set(12.9, ".pupil", { scale: 1 });
        // The icon drops onto the bar on the bar line at 14.00 (boing).
        set(13.5, "#icon", { opacity: 1 });
        to(13.55, "#icon", { y: 200, duration: 0.45, ease: "power2.in" });
        to(14.0, "#icon", { scaleY: 0.6, scaleX: 0.9, duration: 0.06, ease: "power2.out" });
        to(14.06, "#icon", { scaleY: 0.75, scaleX: 0.75, duration: 0.35, ease: "back.out(3)" });
        squash(14.0, 0.82, 1.1);
        // The show starts: lights snap on (bulbs run out from the centre), the drapes swing open.
        to(14.0, "#stage-dim", { opacity: 0, duration: 0.14, ease: "power2.out" });
        to(14.02, "#spot", { opacity: 1, duration: 0.3, ease: "power2.out" });
        tl.to(".bulb", { fill: LIT, duration: 0.04, stagger: { each: 0.022, from: "center" } }, 14.0);
        to(14.04, "#drape-l", { x: -96, duration: 0.8, ease: "power3.out" });
        to(14.04, "#drape-r", { x: 96, duration: 0.8, ease: "power3.out" });
        eyes(14.05, "happy");
        mouth(14.05, "open");
        // It plugs in: the icon sinks into the bar and the real seekbar floods out of it.
        to(14.32, "#icon", { y: 360, scale: 0.18, opacity: 0, duration: 0.26, ease: "power3.in" });
        to(14.35, "#seeks", { clipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: "power2.out" });
        squash(14.56, 0.9, 1.04);

        // ---------- S3 thay áo: one take per outfit ----------
        eyes(15.3, "open");
        mouth(15.3, "smile");
        look(15.3, 0, 0);
        [17.06, 17.94, 18.75, 19.62].forEach((t) => squash(t, 0.86, 1.07));
        const tagIn = [
          ["#tag-aurora", 17.06, { y: 60, scale: 0.7 }],
          ["#tag-silk", 17.94, { x: -140, scale: 1 }],
          ["#tag-holo", 18.75, { y: -40, scale: 1.25 }],
          ["#tag-ink", 19.62, { y: 50, scale: 0.8 }],
        ];
        // Position springs; blur and opacity never overshoot (a negative blur is invalid CSS).
        tagIn.forEach(([id, t, from]) => {
          const el = id + " .tag-text";
          tl.fromTo(el, { x: 0, y: 0, scale: 1, ...from },
            { x: 0, y: 0, scale: 1, duration: 0.34, ease: "back.out(1.8)", immediateRender: false }, t);
          tl.fromTo(el, { opacity: 0, filter: "blur(10px)" },
            { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power2.out", immediateRender: false }, t);
        });
        // "Mười bốn bộ": 14 slams in while the outfits flash past.
        tl.fromTo("#tag-14 .tag-text", { opacity: 0, scale: 1.7, filter: "blur(8px)" },
          { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.3, ease: "expo.out", immediateRender: false }, 20.75);
        squash(20.75, 0.84, 1.08);
        eyes(20.75, "wide", 0.06);
        mouth(20.75, "o");
        // "có bộ còn nhún nhảy theo nhạc thật luôn": Phổ âm, and it dances on every beat.
        tl.fromTo("#tag-spectrum .tag-text", { y: 40, scale: 0.8 },
          { y: 0, scale: 1, duration: 0.32, ease: "back.out(2)", immediateRender: false }, 21.64);
        tl.fromTo("#tag-spectrum .tag-text", { opacity: 0 },
          { opacity: 1, duration: 0.12, ease: "power2.out", immediateRender: false }, 21.64);
        eyes(21.64, "happy");
        mouth(21.64, "open");
        for (let k = 18; k <= 23; k++) hop(beat(k), 9, k % 2 ? 3 : -3);
        chase(18, 23);
        to(beat(23) + 0.2, "#bob", { rotation: 0, duration: 0.2, ease: "power2.out" });

        // ---------- S4 karaoke ----------
        // The stage clears and a mic pops in; the real lyrics engine sings.
        to(23.95, "#apps", { opacity: 0, y: 10, duration: 0.18, ease: "power2.in" });
        to(23.95, "#tray", { opacity: 0, y: 10, duration: 0.18, ease: "power2.in" });
        set(24.08, "#mic", { opacity: 1 });
        to(24.08, "#mic", { scale: 1, duration: 0.4, ease: "back.out(2.4)" });
        eyes(24.1, "open");
        look(24.1, 3, -1);
        for (let k = 24; k <= 35; k++) mouth(beat(k), k % 2 ? "o" : "smile");
        squash(25.96, 0.88, 1.05);
        squash(26.81, 0.88, 1.05);
        // "tiếng Việt vẫn đủ dấu": a proud little hop.
        eyes(27.7, "happy");
        hop(beat(32), 7);
        // The mic leaves and the bar gets ready for its trip.
        to(29.12, "#mic", { y: 40, opacity: 0, duration: 0.18, ease: "power3.in" });
        mouth(29.2, "smile");
        eyes(29.2, "open");
        look(29.2, 0, 2);
        to(29.25, "#apps", { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" });
        to(29.25, "#tray", { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" });

        // ---------- S5 Windows 11: it becomes the taskbar, then gets cleaned ----------
        place(29.3, DESK, 0.65, "power3.inOut");
        to(29.3, "#strip", { borderRadius: 0, duration: 0.65, ease: "power3.inOut" });
        to(29.3, "#shadow", { opacity: 0, duration: 0.3, ease: "power2.out" });
        set(29.3, "#desk-art", { opacity: 0 });
        to(29.35, "#desk-art", { opacity: 1, duration: 0.4, ease: "power2.out" });
        // "Taskbar trong suốt": the camera drops to the taskbar and rides along with the squeegee;
        // the glass is gone behind it and the wallpaper shows through.
        to(30.85, "#cam", { x: 0, y: -648, scale: 1.6, duration: 0.55, ease: "power2.inOut" });
        set(31.2, "#squeegee-art", { x: -160, y: 984 });
        to(31.25, "#squeegee-art", { x: -40, duration: 0.2, ease: "power2.out" });
        to(31.45, "#squeegee-art", { x: 1880, duration: 1.4, ease: "power1.inOut" });
        to(31.45, "#glass", { clipPath: "inset(0% 0% 0% 100%)", duration: 1.4, ease: "power1.inOut" });
        to(31.45, "#cam", { x: -1152, duration: 1.4, ease: "power1.inOut" });
        to(32.85, "#squeegee-art", { x: 2120, duration: 0.25, ease: "power3.in" });
        look(31.45, 4, 0, 0.3);
        // "sạch bong như mới lau kính": a glint and three sparkles.
        set(33.25, "#glint-band", { x: -300 });
        to(33.27, "#glint-band", { x: 2100, duration: 0.6, ease: "power2.inOut" });
        eyes(33.3, "happy");
        [["#spark1", 33.4, 900], ["#spark2", 33.55, 1260], ["#spark3", 33.68, 1640]].forEach(([s, t, x]) => {
          set(33.3, s, { x, y: 984, scale: 0, rotation: 0 });
          to(t, s, { scale: 1.7, rotation: 45, duration: 0.18, ease: "back.out(3)" });
          to(t + 0.22, s, { scale: 0, rotation: 90, duration: 0.2, ease: "power2.in" });
        });
        to(34.45, "#cam", { x: 0, y: 0, scale: 1, duration: 0.6, ease: "power2.inOut" });

        // ---------- S6 control center ----------
        eyes(35.2, "open");
        set(35.3, "#cursor-art", { x: 1830, y: 1180, scale: 1 });
        to(35.4, "#cursor-art", { x: 1757, y: 1044, duration: 0.55, ease: "power3.out" });
        to(35.9, "#spk-hl", { opacity: 1, duration: 0.1, ease: "power1.out" });
        to(36.15, "#cursor-art", { scale: 0.86, duration: 0.05, ease: "power2.out" });
        to(36.2, "#cursor-art", { scale: 1, duration: 0.12, ease: "power2.out" });
        // The real panel springs up from the tray.
        set(36.1, "#panel-pop", { y: 46, opacity: 0 });
        to(36.18, "#panel-pop", { y: 0, opacity: 1, duration: 0.34, ease: "expo.out" });
        set(36.1, "#pnl-out", { opacity: 0 });
        set(36.1, "#pnl-list", { x: 200, opacity: 0 });
        // "thông báo": the notifications.
        // (Camera offsets stay inside the desktop: x >= 1920(1 - s), y >= 1080(1 - s).)
        to(36.5, "#cam", { x: -864, y: 0, scale: 1.45, duration: 0.5, ease: "power2.inOut" });
        // "cài đặt nhanh": the quick settings.
        to(37.4, "#cam", { x: -672, y: -378, scale: 1.35, duration: 0.5, ease: "power2.inOut" });
        // "đổi loa": back out, click the output row, the device list slides out to the left.
        to(38.0, "#cam", { x: 0, y: 0, scale: 1, duration: 0.45, ease: "power2.inOut" });
        set(38.0, "#spk-hl", { opacity: 0 });
        to(37.98, "#cursor-art", { x: 1384, y: 910, duration: 0.47, ease: "power3.inOut" });
        to(38.5, "#cursor-art", { scale: 0.86, duration: 0.05, ease: "power2.out" });
        to(38.55, "#cursor-art", { scale: 1, duration: 0.12, ease: "power2.out" });
        to(38.52, "#pnl-out", { opacity: 1, duration: 0.08, ease: "none" });
        to(38.52, "#pnl-list", { x: 0, opacity: 1, duration: 0.4, ease: "expo.out" });
        // "gom hết một chỗ": it all sits in one place; then the panel closes.
        to(40.7, "#panel-pop", { y: 40, opacity: 0, duration: 0.2, ease: "power3.in" });
        to(40.7, "#cursor-art", { x: 1700, y: 1180, duration: 0.3, ease: "power3.in" });

        // ---------- S7 claim: back on the stage, tired, then it dances ----------
        place(40.85, MACRO, 0.65, "power3.inOut");
        to(40.85, "#strip", { borderRadius: 36, duration: 0.65, ease: "power3.inOut" });
        to(41.2, "#shadow", { opacity: 1, duration: 0.3, ease: "power2.out" });
        to(40.85, "#glass", { clipPath: "inset(0% 0% 0% 0%)", duration: 0.45, ease: "power2.inOut" });
        to(41.0, "#desk-art", { opacity: 0, duration: 0.45, ease: "power2.inOut" });
        eyes(41.5, "tired", 0.25);
        mouth(41.5, "flat");
        look(41.5, 0, 3, 0.3);
        to(41.5, "#squash", { scaleY: 0.93, scaleX: 1.01, duration: 0.6, ease: "power2.out" });
        set(41.8, "#sweat", { opacity: 1, y: -2 });
        to(41.8, "#sweat", { y: 10, duration: 1.0, ease: "power1.in" });
        to(42.6, "#sweat", { opacity: 0, duration: 0.2, ease: "power1.in" });
        // "Cho nó vui một chút đi": it perks up and dances on the beat.
        to(44.9, "#squash", { scaleY: 1, scaleX: 1, duration: 0.3, ease: "back.out(2)" });
        eyes(45.05, "happy");
        mouth(45.05, "open");
        for (let k = 73; k <= 76; k++) hop(beat(k), 11, k % 2 ? 4 : -4);
        chase(73, 76);
        to(beat(76) + 0.2, "#bob", { rotation: 0, duration: 0.2, ease: "power2.out" });
        [["#note4", 45.3, 820, 300], ["#note5", 46.1, 1130, 320]].forEach(([n, t, x, y]) => {
          set(45.1, n, { x, y: y + 40, opacity: 0, scale: 0.6, rotation: 0 });
          to(t, n, { y: y - 70, opacity: 1, scale: 1, rotation: 12, duration: 0.5, ease: "power2.out" });
          to(t + 0.5, n, { opacity: 0, y: y - 110, duration: 0.3, ease: "power1.in" });
        });

        // ---------- S8 end card: the bar carries the mark in ----------
        place(46.85, END, 0.5, "power3.inOut");
        squash(47.32, 0.8, 1.1);
        set(47.3, "#icon", { x: 860, y: 700, scale: 0.18, opacity: 0, rotation: -12 });
        set(47.36, "#icon", { opacity: 1 });
        to(47.36, "#icon", { x: 550, duration: 0.6, ease: "power3.out" });
        to(47.36, "#icon", { y: 250, scale: 1, rotation: 0, duration: 0.6, ease: "back.out(1.5)" });
        set(47.0, "#wordmark", { clipPath: "inset(0% 100% 0% 0%)" });
        to(47.62, "#wordmark", { clipPath: "inset(0% 0% 0% 0%)", duration: 0.55, ease: "power3.out" });
        const words = ["#tagline span:nth-child(1)", "#tagline span:nth-child(2)", "#tagline span:nth-child(3)",
          "#tagline span:nth-child(4)", "#tagline span:nth-child(5)"];
        const at = [48.5, 48.71, 49.14, 50.0, 50.22];
        words.forEach((w, i) => {
          set(47.0, w, { opacity: 0, filter: "blur(6px)" });
          to(at[i], w, { opacity: 1, filter: "blur(0px)", duration: 0.14, ease: "power2.out" });
        });
        eyes(47.4, "happy");
        mouth(47.4, "open");
        look(47.4, 0, 0);
        // It keeps time on each bar under the held card.
        [beat(80), beat(84), beat(88)].forEach((t) => hop(t, 5));
        chase(79, 87);

        tl.set({}, {}, 52.4);
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
